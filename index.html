    <title>GRANDXGAMER</title>
    <script>
      /* Theme before first paint (same rules as src/lib/theme.js): dark by default, or the saved choice. */
      (function () { var p = 'dark'; try { p = localStorage.getItem('pocketos.theme') || 'dark' } catch (e) {}
        var t = p === 'system' ? (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark') : (p === 'light' ? 'light' : 'dark');
        document.documentElement.setAttribute('data-theme', t);
        if (t === 'light') document.querySelector('meta[name="theme-color"]').setAttribute('content', '#f4f3f7'); })();
    </script>
    <style>
      /* Splash: painted before any JS loads; React replaces #root's content on first render.
         Kept in sync with <Splash /> in src/App.jsx so the hand-off is seamless. */
      html, body { margin: 0; background: #16131f; }
      html[data-theme="light"], html[data-theme="light"] body { background: #f4f3f7; }
      .splash { position: fixed; inset: 0; display: grid; place-content: center; justify-items: center; gap: 16px; background: #16131f;
        font: 700 22px 'IBM Plex Sans', system-ui, sans-serif; letter-spacing: -.01em; color: #efedf6; }
      html[data-theme="light"] .splash { background: #f4f3f7; color: #1f2329; }
      .splash svg { width: 76px; height: 76px; border-radius: 20px; animation: splash-pulse 1.6s ease-in-out infinite; }
      @keyframes splash-pulse { 50% { transform: scale(.95); opacity: .85; } }
      @media (prefers-reduced-motion: reduce) { .splash svg { animation: none; } }
    </style>
