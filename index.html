    <script>
      /* Theme before first paint (same rules as src/lib/theme.js): dark by default, or the saved choice. */
      (function () { var p = 'dark'; try { p = localStorage.getItem('pocketos.theme') || 'dark' } catch (e) {}
        var t = p === 'system' ? (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark') : (p === 'light' ? 'light' : 'dark');
        document.documentElement.setAttribute('data-theme', t);
        if (t === 'light') document.querySelector('meta[name="theme-color"]').setAttribute('content', '#f6f2f1'); })();
    </script>
    <style>
      /* Splash: painted before any JS loads; React replaces #root's content on first render.
         Kept in sync with <Splash /> in src/App.jsx so the hand-off is seamless. */
      html, body { margin: 0; background: #0f0d0e; }
      html[data-theme="light"], html[data-theme="light"] body { background: #f6f2f1; }
      .splash { position: fixed; inset: 0; display: grid; place-content: center; justify-items: center; gap: 16px; background: #0f0d0e;
        font: 400 26px 'Anton', 'Oswald', Impact, sans-serif; letter-spacing: .03em; color: #ec6a64; }
      html[data-theme="light"] .splash { background: #f6f2f1; color: #b13a3e; }
      .splash img { width: 76px; height: 76px; border-radius: 20px; animation: splash-pulse 1.6s ease-in-out infinite; }
      @keyframes splash-pulse { 50% { transform: scale(.95); opacity: .85; } }
      @media (prefers-reduced-motion: reduce) { .splash img { animation: none; } }
    </style>
  </head>
  <body>
    <div id="root"><div class="splash" aria-label="Loading GRANDXGAMER"><img src="/brand/mark.png" alt="" aria-hidden="true"><span>GRANDXGAMER</span></div></div>
    <script>
      // Self-repair (owner got stuck on the splash after an update): if the app's code hasn't started
      // within 12 s — usually an old offline copy asking for files a new deploy replaced — drop the
      // offline copy and reload once per tab. main.jsx sets window.__gxStarted.
      window.__gxRecover = function () {
        try { if (sessionStorage.getItem('gx.recovered')) return; sessionStorage.setItem('gx.recovered', '1'); } catch (e) { return; }
        var jobs = [];
        if (navigator.serviceWorker) jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); }));
        if (window.caches) jobs.push(caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); }));
        Promise.all(jobs).catch(function () {}).then(function () { location.reload(); });
      };
      setTimeout(function () { if (!window.__gxStarted) window.__gxRecover(); }, 12000);
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
